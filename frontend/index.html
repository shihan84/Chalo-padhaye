<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chalo Padhaye</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;max-width:850px;margin:0 auto;padding:20px;background:#f6f7fb;color:#111}h1{margin:0 0 4px}.sub{color:#555}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px #0001}.login{max-width:430px;margin:35px auto}.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.mode{background:#fff;border:2px solid transparent;text-align:left}.mode.active{border-color:#111}.picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}select,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:12px;background:#fff;font-size:16px}.chat{height:48vh;overflow:auto;padding:8px}.msg{padding:12px 14px;margin:10px 0;border-radius:14px;max-width:82%;line-height:1.5}.me{background:#e8f0ff;margin-left:auto;white-space:pre-wrap}.bot{background:#fff3d9}.row{display:flex;gap:8px;margin-top:12px}.row input{flex:1;min-width:0}button{padding:12px 16px;border:0;border-radius:12px;font-weight:700;cursor:pointer}.send{background:#111;color:#fff}.mic{background:#ffd84d}.secondary{background:#eee}.voicebar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.voicebar button{padding:8px 12px}.status,.small{font-size:13px;color:#666}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.hidden{display:none!important}@media(max-width:560px){body{padding:14px}.picker,.modes{grid-template-columns:1fr}.chat{height:45vh}}</style></head>
<body><div class="top"><div><h1>Chalo Padhaye 📚</h1><p id="subtitle" class="sub">School + Homeschool Learning</p></div><button id="logout" class="secondary hidden">Logout</button></div>
<div id="login" class="card login"><h2>Parent Login</h2><p class="sub">Login to open your children's private learning profiles.</p><input id="email" type="email" placeholder="Parent email"><br><br><input id="password" type="password" placeholder="Password"><br><br><button id="loginBtn" class="send">Login</button><p id="loginStatus" class="status"></p></div>
<div id="app" class="hidden"><div class="modes"><button id="schoolMode" class="mode active">🏫 <b>School Study</b><br><span class="small">Maharashtra State Board</span></button><button id="homeMode" class="mode">🏠 <b>Homeschool Learning</b><br><span class="small">NIOS Open Basic Education</span></button></div><div class="picker"><select id="student"></select><select id="subject"></select></div><div class="card"><div id="chat" class="chat"></div><div class="voicebar"><button id="replay" class="secondary" disabled>🔊 Replay</button><button id="mute" class="secondary">🔈 Voice on</button><span id="voiceStatus" class="small"></span></div><div class="row"><button id="mic" class="mic">🎤</button><input id="q" placeholder="Type your answer or question..."><button id="send" class="send">Send</button></div><p id="status" class="status"></p><p class="small">The tutor teaches one small step, asks one question, then waits for the child.</p></div></div>
<script>
let CFG={},accessToken='',students=[],sessionId=null,lastTutorText='',voiceMuted=false,currentAudio=null,currentAudioUrl='',curriculum='maharashtra';const $=s=>document.querySelector(s);const schoolSubjects={5:[['evs1','EVS Part 1'],['evs2','EVS Part 2'],['math','Mathematics'],['english','English']],3:[['math','Mathematics'],['english','English']]};const niosSubjects={3:[['evs','EVS — NIOS Level A']],5:[]};
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function renderTutor(s){let x=esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');return '<p>'+x.replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>')+'</p>'}function add(t,c){const d=document.createElement('div');d.className='msg '+c;c==='bot'?d.innerHTML=renderTutor(t):d.textContent=t;$('#chat').appendChild(d);$('#chat').scrollTop=$('#chat').scrollHeight}
function current(){return students.find(x=>x.id===$('#student').value)}function fillSubjects(){const p=current();if(!p)return;const list=curriculum==='nios'?(niosSubjects[p.grade]||[]):(schoolSubjects[p.grade]||[]);$('#subject').innerHTML='';list.forEach(([v,t])=>$('#subject').add(new Option(t,v)));resetChat()}function resetChat(){stopVoice();sessionId=null;lastTutorText='';$('#replay').disabled=true;const p=current();if(!p)return;$('#chat').innerHTML='';const level=p.grade===3?'Level A':'Level B';const intro=curriculum==='nios'?`Hi ${p.full_name.split(' ')[0]}! Homeschool mode mein hum NIOS OBE ${level} ko step-by-step padhenge. Aaj kya seekhna hai?`:`Hi ${p.full_name.split(' ')[0]}! Main tumhara Grade ${p.grade} school tutor hoon. Aaj kya padhna hai?`;add(intro,'bot');if(!$('#subject').options.length&&curriculum==='nios')add('Is NIOS level ke verified textbook subjects abhi add kiye ja rahe hain. Available material ko hi tutor use karega.','bot');$('#status').textContent=curriculum==='nios'?'NIOS Homeschool profile active.':'Maharashtra School profile active.'}
function setMode(mode){curriculum=mode;$('#schoolMode').classList.toggle('active',mode==='maharashtra');$('#homeMode').classList.toggle('active',mode==='nios');$('#subtitle').textContent=mode==='nios'?'NIOS Open Basic Education • Homeschool':'Maharashtra State Board • School Study';fillSubjects()}
async function loadStudents(){const r=await fetch(`${CFG.supabase_url}/rest/v1/students?select=id,full_name,grade,medium,board&order=created_at.asc`,{headers:{apikey:CFG.supabase_anon_key,Authorization:`Bearer ${accessToken}`}});if(!r.ok)throw new Error('Could not load student profiles');students=await r.json();$('#student').innerHTML='';students.forEach(s=>$('#student').add(new Option(`${s.full_name} — Grade ${s.grade}`,s.id)));if(!students.length)throw new Error('No student profiles found for this parent');fillSubjects()}
async function login(){$('#loginStatus').textContent='Signing in...';try{const r=await fetch(`${CFG.supabase_url}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:CFG.supabase_anon_key,'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Login failed');accessToken=j.access_token;sessionStorage.setItem('cp_token',accessToken);await loadStudents();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden')}catch(e){ $('#loginStatus').textContent=e.message}}
function stopVoice(){if(currentAudio){currentAudio.pause();currentAudio=null}if(currentAudioUrl){URL.revokeObjectURL(currentAudioUrl);currentAudioUrl=''}}async function speakTutor(text,force=false){if((voiceMuted&&!force)||!text)return;stopVoice();$('#voiceStatus').textContent='Tutor voice is preparing...';try{const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${accessToken}`},body:JSON.stringify({text})});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.detail||'Voice unavailable')}const blob=await r.blob();currentAudioUrl=URL.createObjectURL(blob);currentAudio=new Audio(currentAudioUrl);currentAudio.playbackRate=.9;currentAudio.onplay=()=>{$('#voiceStatus').textContent='Tutor is speaking slowly...'};currentAudio.onended=()=>{$('#voiceStatus').textContent='Your turn — answer the question.';$('#q').focus()};currentAudio.onerror=()=>{$('#voiceStatus').textContent='Voice playback failed.'};await currentAudio.play()}catch(e){$('#voiceStatus').textContent=e.message}}
async function send(){const v=$('#q').value.trim(),p=current();if(!v||!p||!$('#subject').value)return;stopVoice();add(v,'me');$('#q').value='';$('#status').textContent='Finding the relevant lesson...';$('#send').disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${accessToken}`},body:JSON.stringify({message:v,student_id:p.id,subject:$('#subject').value,curriculum,session_id:sessionId})});const j=await r.json();if(r.status===401){logout();throw new Error('Session expired. Please login again.')}if(!r.ok)throw new Error(j.detail||'Tutor request failed');sessionId=j.session_id||sessionId;lastTutorText=j.text||'';add(lastTutorText||'No response received.','bot');$('#replay').disabled=!lastTutorText;$('#status').textContent=j.sources&&j.sources.length?`Lesson source: ${j.sources[0]}`:'Lesson saved to learning history.';if(lastTutorText)speakTutor(lastTutorText)}catch(e){add(e.message,'bot');$('#status').textContent='Request failed.'}finally{$('#send').disabled=false}}
function logout(){stopVoice();accessToken='';students=[];sessionId=null;sessionStorage.removeItem('cp_token');$('#app').classList.add('hidden');$('#logout').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginStatus').textContent=''}async function boot(){const r=await fetch('/api/config');CFG=await r.json();$('#voiceStatus').textContent=CFG.custom_voice?'Custom tutor voice ready.':'Custom voice needs server configuration.';if(!CFG.supabase_url||!CFG.supabase_anon_key){$('#loginStatus').textContent='Supabase configuration is missing.';return}const saved=sessionStorage.getItem('cp_token');if(saved){accessToken=saved;try{await loadStudents();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden')}catch(e){logout()}}}
$('#loginBtn').onclick=login;$('#logout').onclick=logout;$('#send').onclick=send;$('#replay').onclick=()=>speakTutor(lastTutorText,true);$('#mute').onclick=()=>{voiceMuted=!voiceMuted;if(voiceMuted)stopVoice();$('#mute').textContent=voiceMuted?'🔇 Voice off':'🔈 Voice on'};$('#schoolMode').onclick=()=>setMode('maharashtra');$('#homeMode').onclick=()=>setMode('nios');$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')send()});$('#student').onchange=fillSubjects;$('#subject').onchange=resetChat;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('#mic').onclick=()=>{if(!SR){add('Microphone speech recognition is not supported in this browser.','bot');return}const r=new SR();r.lang='hi-IN';r.interimResults=false;r.onresult=e=>{$('#q').value=e.results[0][0].transcript;send()};r.start()};boot();
</script></body></html>
