<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Chalo Padhaye</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;max-width:850px;margin:0 auto;padding:24px;background:#f6f7fb}h1{margin-bottom:4px}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 5px 20px #0001}.chat{height:58vh;overflow:auto;padding:8px}.msg{padding:12px 14px;margin:10px 0;border-radius:14px;max-width:80%}.me{background:#e8f0ff;margin-left:auto}.bot{background:#fff3d9}.row{display:flex;gap:8px;margin-top:12px}input{flex:1;padding:14px;border:1px solid #bbb;border-radius:12px;font-size:16px}button{padding:12px 16px;border:0;border-radius:12px;font-weight:700;cursor:pointer}.send{background:#111;color:#fff}.mic{background:#ffd84d}.small{font-size:12px;color:#666}</style></head><body><h1>Chalo Padhaye 📚</h1><p>Class 5 • Maharashtra State Board • English Medium</p><div class='card'><div id='chat' class='chat'><div class='msg bot'>Hi Usman! Main tumhara study tutor hoon. Aaj kya padhna hai?</div></div><div class='row'><button id='mic' class='mic'>🎤</button><input id='q' placeholder='Type your answer or question...'><button id='send' class='send'>Send</button></div><p class='small'>Voice playback uses your Mac/browser voice. Microphone works when the browser supports SpeechRecognition.</p></div><script>const chat=document.querySelector('#chat'),q=document.querySelector('#q');function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function send(){const v=q.value.trim();if(!v)return;add(v,'me');q.value='';const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});const j=await r.json();add(j.text,'bot');if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(j.text);u.lang='hi-IN';speechSynthesis.speak(u)}}document.querySelector('#send').onclick=send;q.addEventListener('keydown',e=>{if(e.key==='Enter')send()});const SR=window.SpeechRecognition||window.webkitSpeechRecognition;document.querySelector('#mic').onclick=()=>{if(!SR){add('Microphone speech recognition is not supported in this browser. You can type your answer.','bot');return}const r=new SR();r.lang='hi-IN';r.interimResults=false;r.onresult=e=>{q.value=e.results[0][0].transcript;send()};r.start()};</script></body></html>
