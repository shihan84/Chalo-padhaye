<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Chalo Padhaye</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;max-width:850px;margin:0 auto;padding:20px;background:#f6f7fb;color:#111}h1{margin:0 0 4px}.sub{margin:0 0 14px;color:#555}.picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.picker select{width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;background:#fff;font-size:16px}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 5px 20px #0001}.chat{height:54vh;overflow:auto;padding:8px}.msg{padding:12px 14px;margin:10px 0;border-radius:14px;max-width:82%;white-space:pre-wrap}.me{background:#e8f0ff;margin-left:auto}.bot{background:#fff3d9}.row{display:flex;gap:8px;margin-top:12px}input{flex:1;min-width:0;padding:14px;border:1px solid #bbb;border-radius:12px;font-size:16px}button{padding:12px 16px;border:0;border-radius:12px;font-weight:700;cursor:pointer}.send{background:#111;color:#fff}.mic{background:#ffd84d}.small{font-size:12px;color:#666}.status{font-size:13px;color:#666;margin:6px 0 0}@media(max-width:560px){body{padding:14px}.picker{grid-template-columns:1fr}.chat{height:52vh}}</style></head><body><h1>Chalo Padhaye 📚</h1><p class='sub' id='subtitle'>Maharashtra State Board • English Medium</p><div class='picker'><select id='student'><option value='Usman Ali|5'>Usman Ali — Grade 5</option><option value='Zaira Fatima|3'>Zaira Fatima — Grade 3</option><option value='Zoya Fatima|3'>Zoya Fatima — Grade 3</option></select><select id='subject'></select></div><div class='card'><div id='chat' class='chat'></div><div class='row'><button id='mic' class='mic'>🎤</button><input id='q' placeholder='Type your answer or question...'><button id='send' class='send'>Send</button></div><p class='status' id='status'></p><p class='small'>Voice playback uses your browser voice. Microphone works when the browser supports SpeechRecognition.</p></div><script>const chat=document.querySelector('#chat'),q=document.querySelector('#q'),student=document.querySelector('#student'),subject=document.querySelector('#subject'),status=document.querySelector('#status');const subjects={5:[['evs1','EVS Part 1'],['evs2','EVS Part 2'],['math','Mathematics'],['english','English']],3:[['math','Mathematics'],['english','English']]};function profile(){const [name,grade]=student.value.split('|');return{name,grade:Number(grade)}}function fillSubjects(){const p=profile();subject.innerHTML='';subjects[p.grade].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;subject.appendChild(o)});resetChat()}function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function resetChat(){const p=profile();chat.innerHTML='';add(`Hi ${p.name.split(' ')[0]}! Main tumhara Grade ${p.grade} study tutor hoon. Aaj kya padhna hai?`,'bot');status.textContent=p.grade===3?'Grade 3 cloud textbooks: Mathematics and English are active.':'Official Balbharati cloud textbook retrieval is active.'}async function send(){const v=q.value.trim();if(!v)return;const p=profile();add(v,'me');q.value='';status.textContent='Textbook se relevant part dhoondh raha hoon...';document.querySelector('#send').disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v,student_name:p.name,grade:p.grade,subject:subject.value})});const j=await r.json();add(j.text||'No response received.','bot');status.textContent=j.sources&&j.sources.length?`Textbook source: ${j.sources[0]}`:'No matching textbook passage found.';if('speechSynthesis'in window&&j.text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(j.text);u.lang='hi-IN';speechSynthesis.speak(u)}}catch(e){add('Connection problem. Please try again.','bot');status.textContent='Request failed.'}finally{document.querySelector('#send').disabled=false}}document.querySelector('#send').onclick=send;q.addEventListener('keydown',e=>{if(e.key==='Enter')send()});student.onchange=fillSubjects;subject.onchange=resetChat;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;document.querySelector('#mic').onclick=()=>{if(!SR){add('Microphone speech recognition is not supported in this browser. You can type your answer.','bot');return}const r=new SR();r.lang='hi-IN';r.interimResults=false;r.onresult=e=>{q.value=e.results[0][0].transcript;send()};r.start()};fillSubjects();</script></body></html>
