name: PHP audit checks
on:
  pull_request:
    branches: [hostinger-php]
  push:
    branches: [hostinger-php]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -v
      - run: find php tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/php_regressions.php
  mysql-api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: audit-fixture-only
          MYSQL_DATABASE: audit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -paudit-fixture-only"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: audit_test
      DB_USER: root
      DB_PASSWORD: audit-fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: mysql -h 127.0.0.1 -u root -paudit-fixture-only audit_test < database/mysql/schema.sql
      - run: |
          php -S 127.0.0.1:8080 php/api/index.php > /tmp/chalo-php-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then break; fi
            sleep 1
          done
          php tests/php_http_integration.php
